# Entorno de produccion con Docker.
# Compila la web y la sirve con nginx. Ajusta el puerto y las variables de entorno
# segun tu despliegue.
#
# Uso:
#   cp .env.example .env.production
#   # llena las variables reales en .env.production
#   docker compose -f docker-compose.prod.yml up --build -d
#
# La app queda en http://localhost:80

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: ecopac-web-prod
    ports:
      - "80:80"
    env_file:
      - path: .env.production
        required: false
    restart: unless-stopped
