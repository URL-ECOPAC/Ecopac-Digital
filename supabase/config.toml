# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/cli/config#config.toml
# Este archivo lo genera supabase init y se versiona en el repo.
# Se usa tanto para el desarrollo local (supabase start / db reset) como
# para el CI de backend (backend-ci.yml).

# Project ID: nombre unico del proyecto local. No es el project-ref remoto.
project_id = "ecopac-digital"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
# seed.sql: catalogo geografico real (departamentos/municipios), util en cualquier ambiente.
# seed-demo.sql: datos ficticios de demostracion (issue #94), solo para desarrollo. Ambos
# corren con "supabase db reset" (local y el job "validar" del CI); "supabase db push"
# (lo que llega a ecopac-dev/ecopac-prod) nunca ejecuta seeds. Ver docs/DATOS-DEMO.md.
sql_paths = ["seed.sql", "seed-demo.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["*"]
# jwt_expiry: cuanto dura una sesion sin que el cliente la refresque (issue #230, criterio 3).
# El numero de segundos que corresponde esta pendiente de confirmar con la organizacion (ver
# docs/SEGURIDAD.md); 3600 es el default de la CLI, no un acuerdo. enable_refresh_token_rotation
# y refresh_token_reuse_interval tambien son el default de la CLI: se dejan explicitos aqui
# porque, junto con jwt_expiry, son el control real de expiracion de sesion del lado servidor
# (el temporizador de inactividad del cliente, en packages/shared/hooks/useExpiracionPorInactividad.js,
# es una comodidad de interfaz, no una garantia).
jwt_expiry = 3600
# enable_signup = false: en este sistema nadie se da de alta a si mismo (issue #508). Las cuentas
# las crea la administradora, y el rol por defecto de perfiles es 'voluntario general', que
# registra pacientes, expedientes, atenciones y triajes por las politicas de 00032 y 00033. Con
# el registro abierto, cualquiera con la llave anonima -que viaja en el bundle del navegador-
# obtenia acceso de escritura a datos clinicos.
#
# ESTA LINEA NO PROTEGE A ecopac-dev NI A ecopac-prod. El workflow de despliegue solo corre
# `supabase db push`, nunca `supabase config push`, asi que este archivo gobierna el stack local
# y el CI, y en los proyectos remotos manda el Dashboard. La defensa que si viaja con las
# migraciones es la 00073. Ver docs/SEGURIDAD.md, "Alta de cuentas".
#
# Es la unica clave que hace falta tocar: ver el comentario de [auth.email] mas abajo antes de
# anadir la de alli, que apaga el login.
enable_signup = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Limites de inicio de sesion/registro por IP en una ventana de 5 minutos. Son el default de la
# CLI, dejados explicitos por la misma razon de arriba. IMPORTANTE: esto NO es el bloqueo por
# cuenta del criterio 2 de la issue #230 (ese salio del alcance de #230, ver docs/SEGURIDAD.md):
# es un limite por IP compartida, no por cuenta, y no deja un registro consultable de intentos.
[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
# OJO: esta clave se queda en true a proposito, y no es un olvido de la issue #508.
#
# Basta con enable_signup = false en [auth] para que POST /auth/v1/signup devuelva
# 422 signup_disabled. Poner ADEMAS esta en false apaga el proveedor de correo entero: el login
# pasa a responder 422 email_provider_disabled y **nadie puede iniciar sesion**. Comprobado
# cambiando una linea cada vez y reiniciando el stack.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = true
port = 54327
