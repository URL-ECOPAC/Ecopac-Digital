server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Soporte para rutas de React Router (SPA).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Mismas cabeceras que vercel.json (raiz y apps/web), verificadas contra ellas por
  # verificar:cabeceras-http (issue #760). "always" para que se manden incluso en respuestas de
  # error, que es lo que recomienda la documentacion de nginx para cabeceras de seguridad.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
