name: Bug
description: Reportar un error o comportamiento inesperado
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Completa el formulario con el mayor detalle posible.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion del bug
      description: Que ocurrio? Describe el comportamiento inesperado.
      placeholder: "Cuando hago clic en 'Guardar', aparece un error 500..."
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Que deberia suceder?
      placeholder: "El formulario deberia guardarse y mostrar confirmacion"
    validations:
      required: true

  - type: textarea
    id: reproduccion
    attributes:
      label: Pasos para reproducir
      description: Como reproducir el bug?
      placeholder: |
        1. Ir a la seccion de...
        2. Ingresar los datos...
        3. El error ocurre
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: Modulo
      description: A que modulo pertenece el bug?
      options:
        - module:usuarios
        - module:pacientes
        - module:inventario
        - module:jornadas
        - module:donaciones
        - module:reportes
        - module:infra
    validations:
      required: true

  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      description: Donde se reproduce el bug?
      options:
        - platform:web
        - platform:mobile
        - platform:shared
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      description: Impacto del bug en el proyecto.
      options:
        - priority:alta
        - priority:media
        - priority:baja
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Screenshots, logs, version del navegador, datos de la jornada, etc.
      placeholder: "Navegador: Chrome 126 | Sistema: Windows 11"
