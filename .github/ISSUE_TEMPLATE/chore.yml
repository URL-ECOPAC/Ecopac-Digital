name: Tarea Tecnica
description: Trabajo de infraestructura, configuracion o refactor
title: "[CHORE] "
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: Usa esta plantilla para tareas que no cambian funcionalidad (deps, config, docs, refactor).

  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion de la tarea
      description: Que hay que hacer y por que.
      placeholder: "Actualizar @supabase/supabase-js a la ultima version..."
    validations:
      required: true

  - type: textarea
    id: definicion_terminado
    attributes:
      label: Definicion de terminado
      description: Pasos o condiciones para dar por terminada la tarea.
      placeholder: |
        - [ ] Paso 1
        - [ ] Paso 2
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: Modulo
      description: Area que afecta la tarea.
      options:
        - module:infra
        - module:usuarios
        - module:pacientes
        - module:inventario
        - module:jornadas
        - module:donaciones
        - module:reportes
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      description: Importancia de la tarea.
      options:
        - priority:alta
        - priority:media
        - priority:baja
    validations:
      required: true

  - type: input
    id: depende
    attributes:
      label: Depende de
      description: Enlazar otro issue si aplica.
      placeholder: "Depende de #12"
    validations:
      required: false
