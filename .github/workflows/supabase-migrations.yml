name: Aplicar migraciones de Supabase

# Corre cuando se mergea a develop (ambiente de pruebas) o a main (produccion).
# Requiere los secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD y el project-ref
# correspondiente a cada ambiente.
# Mientras los secrets no esten configurados, los pasos se omiten y el workflow
# termina en verde (no falla).
#
# Configurar los secrets en: Settings > Secrets and variables > Actions del repositorio.
#   - SUPABASE_ACCESS_TOKEN      (pat del panel de Supabase, "Account > Access tokens")
#   - SUPABASE_DB_PASSWORD       (password de la base de datos del proyecto)
#   - SUPABASE_PROJECT_REF_DEV   (project-ref del proyecto ecopac-dev)
#   - SUPABASE_PROJECT_REF_PROD  (project-ref del proyecto ecopac-prod)

on:
  push:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"

jobs:
  migrate:
    name: Migrar base de datos
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar secrets configurados
        id: check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            PROJECT_REF="$SUPABASE_PROJECT_REF_DEV"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT_REF="$SUPABASE_PROJECT_REF_PROD"
          else
            PROJECT_REF=""
          fi

          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Los secrets de Supabase no estan configurados; se omiten los pasos de migracion."
            echo "Configuralos en: Settings > Secrets and variables > Actions"
          fi

      - name: Vincular proyecto
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "${{ steps.check.outputs.project_ref }}" -p "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migraciones
        if: steps.check.outputs.ready == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
