name: Respaldo de la base

# Saca un respaldo cifrado de la base de produccion y lo guarda en Google Drive, en la cuenta de
# la organizacion (issue #914, RNF-12). El plan Free de Supabase no incluye respaldos
# (docs/COSTOS-Y-LIMITES.md, seccion 6.2): este workflow es el unico respaldo que existe.
#
# La logica esta en scripts/respaldo-base.sh, para poder ensayarla fuera de Actions contra el
# stack local. Aqui solo se preparan las herramientas y las credenciales. El plan completo, con
# el procedimiento de recuperacion, esta en docs/RESPALDO-Y-RECUPERACION.md.
#
# EL VOLCADO TIENE EXPEDIENTES CLINICOS Y EL REPOSITORIO ES PUBLICO
#
# - Nunca se sube nada de este workflow como artefacto (`actions/upload-artifact`): en un
#   repositorio publico los artefactos los descarga cualquier cuenta de GitHub.
# - Ningun paso imprime contenido del volcado. No agregar `set -x`, `--debug` ni un `cat`.
# - El archivo se cifra en el runner con la llave PUBLICA de la organizacion antes de abrir la
#   conexion con Drive. La llave privada no esta en GitHub: ni este workflow ni quien lea sus
#   secrets puede descifrar un respaldo.
#
# AQUI UN SECRET QUE FALTA ES UN FALLO, NO UN AVISO
#
# El resto de los workflows avisa y termina en verde cuando falta un secret, para no bloquear al
# equipo mientras se configura un ambiente. Este no: un respaldo que no se hizo y se ve en verde
# es exactamente lo que paso con el keep-alive (issue #252, punto 4). Si falta algo, falla.
#
# CUANDO EMPIEZA A CORRER
#
# GitHub dispara `schedule:` UNICAMENTE desde la rama por defecto, que es `main`, y tampoco
# ofrece el boton de `workflow_dispatch` mientras el archivo no exista ahi. Hasta que `develop`
# se mergee a `main` (issue #252) este workflow no corre ni una vez.
#
# GitHub ademas desactiva los workflows programados de un repositorio sin actividad durante 60
# dias, y avisa por correo solo a quien edito por ultima vez el archivo. Por eso el ultimo paso
# abre una issue cuando el respaldo falla, y docs/RESPALDO-Y-RECUPERACION.md pide revisar una vez
# al mes que haya corridas recientes.
#
# Secrets (Settings > Secrets and variables > Actions), detalle en docs/CI-CD.md:
#   - SUPABASE_ACCESS_TOKEN          (ya existe)
#   - SUPABASE_PROJECT_REF_PROD      ref de Ecopac-Digital-Prod (issue #252)
#   - SUPABASE_DB_PASSWORD_PROD      contrasena de la base de produccion (issue #252, punto 2)
#   - RESPALDO_GPG_CLAVE_PUBLICA     llave publica GPG de la organizacion, en ASCII
#   - RESPALDO_DRIVE_CLIENT_ID       cliente de OAuth del proyecto de Google Cloud de la organizacion
#   - RESPALDO_DRIVE_CLIENT_SECRET   su secreto
#   - RESPALDO_DRIVE_TOKEN           token de rclone (JSON con el refresh_token) de la cuenta de Drive

on:
  schedule:
    - cron: "0 7 * * *" # todos los dias, 07:00 UTC (01:00 en Guatemala)
  workflow_dispatch: # a mano, por ejemplo antes de un despliegue grande

permissions:
  contents: read
  issues: write

# Dos respaldos a la vez no aportan nada y competirian por la retencion.
concurrency:
  group: respaldo-base
  cancel-in-progress: false

jobs:
  respaldar:
    name: Respaldar Ecopac-Digital-Prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      # La CLI lee la contrasena de SUPABASE_DB_PASSWORD. Es la de produccion, que no es la de
      # desarrollo (issue #252, punto 2).
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      RESPALDO_CLAVE_PUBLICA: ${{ secrets.RESPALDO_GPG_CLAVE_PUBLICA }}
      # rclone arma el remoto `drive:` con estas variables, sin archivo de configuracion en disco.
      # `drive.file`: rclone solo ve los archivos que el mismo creo, no el resto del Drive de la
      # organizacion. Por eso la carpeta la crea el workflow en la primera corrida y no se crea
      # a mano: una carpeta creada desde el navegador seria invisible para el.
      RCLONE_CONFIG_DRIVE_TYPE: drive
      RCLONE_CONFIG_DRIVE_SCOPE: drive.file
      RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RESPALDO_DRIVE_CLIENT_ID }}
      RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RESPALDO_DRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RESPALDO_DRIVE_TOKEN }}
      RESPALDO_DESTINO: drive:respaldos-ecopac-digital
      RESPALDO_AMBIENTE: ecopac-prod
      # Uno por dia durante 30 dias: como maximo se pierde un dia de trabajo, y se puede volver
      # hasta un mes atras si un error tarda en notarse.
      RESPALDO_CONSERVAR: "30"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar secrets
        run: |
          # `if` y no `[ ... ] && faltan=...`: Actions corre estos scripts con `set -e`, y una
          # lista `&&` cuyo test da falso devuelve 1.
          faltan=""
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then faltan="$faltan SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$SUPABASE_PROJECT_REF_PROD" ]; then faltan="$faltan SUPABASE_PROJECT_REF_PROD"; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then faltan="$faltan SUPABASE_DB_PASSWORD_PROD"; fi
          if [ -z "$RESPALDO_CLAVE_PUBLICA" ]; then faltan="$faltan RESPALDO_GPG_CLAVE_PUBLICA"; fi
          if [ -z "$RCLONE_CONFIG_DRIVE_CLIENT_ID" ]; then faltan="$faltan RESPALDO_DRIVE_CLIENT_ID"; fi
          if [ -z "$RCLONE_CONFIG_DRIVE_CLIENT_SECRET" ]; then faltan="$faltan RESPALDO_DRIVE_CLIENT_SECRET"; fi
          if [ -z "$RCLONE_CONFIG_DRIVE_TOKEN" ]; then faltan="$faltan RESPALDO_DRIVE_TOKEN"; fi

          if [ -n "$faltan" ]; then
            echo "::error title=Respaldo no realizado::Faltan los secrets:$faltan"
            {
              echo "## Respaldo NO realizado"
              echo
              echo "**No se saco ningun respaldo de produccion.** Faltan estos secrets:"
              echo
              for s in $faltan; do echo "- \`$s\`"; done
              echo
              echo "Configuralos en Settings > Secrets and variables > Actions."
              echo "De donde sale cada uno: \`docs/RESPALDO-Y-RECUPERACION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Version fija y no `latest` (issue #422). Al subirla, cambiarla tambien en supabase.yml y
      # en verificar-despliegue.yml.
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.115.0

      # Del archivo de Ubuntu y no del instalador de rclone.org (`curl | bash`): el paquete viene
      # firmado por la distribucion, y este job maneja la credencial de Drive.
      - name: Instalar rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -n 1

      - name: Vincular con Ecopac-Digital-Prod
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF_PROD" -p "$SUPABASE_DB_PASSWORD"

      - name: Sacar, cifrar y subir el respaldo
        run: bash scripts/respaldo-base.sh

      # Un workflow programado que falla solo avisa por correo a quien edito el archivo por
      # ultima vez. La issue le llega a todo el equipo. Si ya hay una abierta se comenta en ella,
      # para no abrir una por dia mientras el problema siga.
      - name: Avisar del fallo con una issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="El respaldo de produccion fallo"
          corrida="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cuerpo="$(printf '%s\n' \
            "El workflow **Respaldo de la base** fallo el $(date -u +%Y-%m-%d) (UTC): $corrida" \
            "" \
            "Mientras esto no se resuelva **no se esta guardando ningun respaldo nuevo de produccion**, y el plan Free de Supabase no ofrece otro." \
            "" \
            "Que revisar, en orden, esta en \`docs/RESPALDO-Y-RECUPERACION.md\`, seccion \"Si el respaldo falla\"." \
            "" \
            "Esta issue se cierra a mano cuando una corrida vuelva a terminar en verde.")"

          abierta="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$abierta" ]; then
            gh issue comment "$abierta" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo" \
              --label "type:bug" --label "module:infra" --label "priority:alta"
          fi
