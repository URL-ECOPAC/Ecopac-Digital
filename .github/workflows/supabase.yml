name: Supabase

# Un solo workflow para la base de datos: valida en el PR y despliega al mergear.
#
# Antes eran dos workflows separados (backend-ci.yml y supabase-migrations.yml) y el que
# aplicaba las migraciones no dependia del que las validaba: una validacion en rojo no
# impedia que el despliegue corriera igual. Ahora "Aplicar migraciones" lleva needs.
#
# Por que no hay filtros paths: un check requerido que no corre deja el PR esperando para
# siempre. Los jobs corren siempre y son los pasos los que llevan el if, asi el check
# siempre reporta. Un PR que no toca supabase/ gasta segundos, no los dos minutos del
# stack local.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  # En push el grupo lleva el SHA, asi que cada commit a develop/main tiene el suyo y ninguno
  # descarta a otro. Antes el grupo era solo la rama, y ahi `cancel-in-progress: false` no
  # alcanza: protege a la corrida que ya arranco, pero GitHub guarda UNA sola corrida en cola
  # por grupo, asi que cada push nuevo cancelaba a la que esperaba turno. Los pushes 676acb3 y
  # c71692f se perdieron exactamente asi, con cero jobs ejecutados; el siguiente (93666b6)
  # fallo, y con el se rompio la cadena de recuperacion que los cubria.
  #
  # El precio es que dos despliegues pueden solaparse. Se prefiere a perder uno en silencio:
  # `db push` aplica migracion por migracion y el peor caso del solape es un fallo que se
  # reintenta, no una base a medias. Ademas el paso "Comprobar el historial remoto" lo detecta
  # y lo explica.
  #
  # En PR se conserva el grupo por rama, que es donde si conviene cancelar lo superado.
  group: supabase-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------------
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.detectar.outputs.supabase }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar si el cambio toca supabase/
        id: detectar
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # En develop y main siempre se valida, sin importar que archivos vinieron.
            echo "supabase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"

          if git diff --quiet "$base" HEAD -- supabase/; then
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca supabase/; la validacion pesada se omite."
          else
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------------
  inmutabilidad:
    name: Migraciones no editadas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar que no se editen migraciones ya aplicadas
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'migracion-editada-a-proposito')
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"

          # Solo se admite agregar migraciones (estado A). Modificar (M), borrar (D) o
          # renombrar (R) una que ya existe en la rama base rompe las bases donde ya se
          # aplico: Supabase la tiene registrada y nunca vuelve a ejecutarla.
          tocadas="$(git diff --name-status --diff-filter=MDR "$base" HEAD -- supabase/migrations/)"

          if [ -z "$tocadas" ]; then
            echo "Ninguna migracion existente fue modificada."
            exit 0
          fi

          echo "::error::Este PR modifica o borra migraciones que ya existen en $GITHUB_BASE_REF."
          echo "$tocadas"

          {
            echo "## Migraciones ya aplicadas modificadas"
            echo
            echo "Una migracion que ya corrio queda registrada en \`supabase_migrations.schema_migrations\`"
            echo "de cada base, y Supabase no la vuelve a ejecutar. Editarla cambia lo que valida el CI"
            echo "(que aplica todo desde cero) pero no cambia nada en las bases reales: ahi es donde"
            echo "aparece la divergencia, ya despues del merge."
            echo
            echo "Archivos:"
            echo
            echo '```'
            echo "$tocadas"
            echo '```'
            echo
            echo "**Que hacer:** dejar la migracion como esta y corregir hacia adelante con una"
            echo "migracion nueva. Ver \`docs/CI-CD.md\`."
            echo
            echo "Si el cambio es intencional y ninguna base la aplico todavia, agrega la etiqueta"
            echo "\`migracion-editada-a-proposito\` al PR."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      - name: Aviso de guarda desactivada
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'migracion-editada-a-proposito')
        run: |
          echo "::warning::La guarda de migraciones se salto por la etiqueta migracion-editada-a-proposito."
          echo "## Guarda de migraciones desactivada" >> "$GITHUB_STEP_SUMMARY"
          echo "Este PR lleva la etiqueta \`migracion-editada-a-proposito\`, asi que se permitio editar migraciones existentes." >> "$GITHUB_STEP_SUMMARY"

      # Un numero de migracion duplicado no es un problema de orden: en
      # supabase_migrations.schema_migrations la columna `version` es el prefijo numerico solo y
      # es clave primaria, asi que el despliegue aborta con SQLSTATE 23505 al llegar al segundo
      # archivo y no aplica ni esa migracion ni las siguientes (issue #411).
      #
      # Corre en pull_request y en push. La comparacion de la regla 2 es contra el TIP de la rama
      # base, no contra el merge-base: por eso una reejecucion caza el caso de dos PR abiertos a la
      # vez que reservaron el mismo numero, aunque cada uno por separado estuviera en verde.
      - name: Verificar la numeracion de las migraciones
        run: |
          MIGRACIONES=supabase/migrations

          archivos="$(find "$MIGRACIONES" -maxdepth 1 -name '*.sql' -printf '%f\n' 2>/dev/null | sort)"
          if [ -z "$archivos" ]; then
            echo "No hay migraciones que comprobar."
            exit 0
          fi

          problemas=""

          # Regla 0: el patron. Va primero porque las otras dos leen el prefijo de estos nombres; un
          # archivo fuera de patron las haria comparar basura y pasar en verde sin comprobar nada.
          fuera="$(echo "$archivos" | grep -Ev '^[0-9]{5}_[a-z0-9_]+\.sql$' || true)"
          if [ -n "$fuera" ]; then
            problemas="$problemas
          ### Nombres fuera de patron

          El nombre tiene que ser \`NNNNN_descripcion_en_snake_case.sql\`, con cinco digitos:

          \`\`\`
          $fuera
          \`\`\`
          "
          fi

          # Regla 1: ningun prefijo repetido en el arbol resultante. Corre sobre el arbol y no sobre el
          # diff a proposito: el choque lo produce la suma de dos PR que por separado son correctos.
          repetidos="$(echo "$archivos" | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$repetidos" ]; then
            detalle=""
            for numero in $repetidos; do
              detalle="$detalle$numero lo usan:
          $(echo "$archivos" | grep "^${numero}_" | sed 's/^/  /')
          "
            done
            problemas="$problemas
          ### Numeros de migracion repetidos

          \`\`\`
          $detalle\`\`\`

          En \`supabase_migrations.schema_migrations\` la columna \`version\` es **el prefijo numerico solo**
          y es **clave primaria**. Dos archivos con el mismo prefijo no se aplican en mal orden: el
          despliegue falla al llegar al segundo con
          \`duplicate key value violates unique constraint \"schema_migrations_pkey\" (SQLSTATE 23505)\`,
          y ni esa migracion ni las que vengan despues se aplican.
          "
          fi

          # Regla 2: ninguna migracion nueva por debajo o igual a la ultima de la rama base. Solo tiene
          # sentido en un PR: despues del merge ya no hay rama base contra la que comparar.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$GITHUB_BASE_REF"
            base_merge="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
            nuevas="$(git diff --name-only --diff-filter=A "$base_merge" HEAD -- "$MIGRACIONES" | xargs -r -n1 basename)"
            ultima_base="$(git ls-tree --name-only "origin/$GITHUB_BASE_REF" "$MIGRACIONES/" | xargs -r -n1 basename | cut -d_ -f1 | sort | tail -1)"

            bajas=""
            for archivo in $nuevas; do
              numero="${archivo%%_*}"
              if [ -n "$ultima_base" ] && ! [ "$numero" \> "$ultima_base" ]; then
                bajas="$bajas  $archivo ($numero) no supera la ultima de $GITHUB_BASE_REF ($ultima_base)
          "
              fi
            done

            if [ -n "$bajas" ]; then
              problemas="$problemas
          ### Numeros por debajo de la ultima de \`$GITHUB_BASE_REF\`

          \`\`\`
          $bajas\`\`\`

          \`supabase db push\` se niega a aplicar una migracion anterior a la ultima que ya registro la base:
          aborta con \`Found local migration files to be inserted before the last migration on remote
          database\`. La salida es renumerar por encima, no pasar \`--include-all\`.
          "
            fi
          fi

          if [ -z "$problemas" ]; then
            echo "Numeracion correcta en $(echo "$archivos" | wc -l) migraciones."
            exit 0
          fi

          # El proximo numero libre sale solo de los nombres que casan el patron: el "prefijo" de un
          # archivo fuera de patron no es un numero y la aritmetica reventaria.
          validos="$(echo "$archivos" | grep -E '^[0-9]{5}_' || true)"
          if [ -n "$validos" ]; then
            libre="$(printf '%05d' "$(( 10#$(echo "$validos" | cut -d_ -f1 | sort | tail -1) + 1 ))")"
            pista=" El proximo numero libre es $libre."
          else
            libre=""
            pista=""
          fi

          echo "::error::Hay un problema con la numeracion de las migraciones.$pista"
          printf '%s\n' "$problemas"

          {
            echo "## Numeracion de migraciones"
            printf '%s\n' "$problemas"
            echo "**Que hacer:** renumerar con \`git mv\` la migracion mas nueva, la que agrega este PR."
            [ -n "$libre" ] && echo "El proximo numero libre es \`$libre\`."
            echo "Renumerar un archivo que todavia no se aplico en ninguna base no tiene coste. El numero se"
            echo "elige al abrir la rama y **se vuelve a verificar antes de mergear**, porque otra rama pudo"
            echo "tomarlo mientras tanto. Ver \`docs/CI-CD.md\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          exit 1

  # --------------------------------------------------------------------------------
  validar:
    name: Validar migraciones y funciones
    needs: cambios
    runs-on: ubuntu-latest
    # Entra en el presupuesto de diez minutos de la issue #223: es check requerido y corre en
    # cada PR, asi que cuenta para el tiempo total del pipeline. Es el job mas caro que hay
    # -levanta el stack, aplica las migraciones desde cero y corre las suites pgTAP- y aun asi
    # mide entre 142 s y 187 s cuando el PR toca supabase/. Si algun dia se acerca al tope, lo
    # que hay que revisar es por que crecio tanto, no subir el numero sin mirar.
    timeout-minutes: 10
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Sin cambios en supabase/
        if: needs.cambios.outputs.supabase != 'true'
        run: echo "El PR no toca supabase/; no hay migraciones ni funciones que validar." >> "$GITHUB_STEP_SUMMARY"

      # El stack local corre sobre Docker y no necesita SUPABASE_ACCESS_TOKEN: ese token
      # sirve para hablar con proyectos remotos. Antes la validacion entera estaba
      # condicionada a el, asi que rotar el secret la apagaba en silencio dejando el
      # workflow en verde.
      # La version va FIJA y no `latest` a proposito (issue #422). Con `latest`, setup-cli
      # resuelve el numero consultando la API de releases de GitHub SIN autenticar, y los
      # runners comparten esa cuota por IP: el 25 de agosto el despliegue de develop murio con
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded" antes de aplicar
      # una sola migracion. Con una version concreta esa llamada no se hace.
      #
      # De paso el CI valida con la misma version que tiene instalada el equipo, en vez de con
      # la que resulte ser la ultima ese dia. Al subirla, cambiarla en los CUATRO pasos que
      # instalan el CLI: los tres de este archivo y el de verificar-despliegue.yml.
      #
      # La accion va en v3 y no en v1 porque la v1 corre sobre Node 20, que GitHub ya esta
      # retirando. La v3 es composite e instala el CLI desde npm, asi que ademas deja de tocar
      # la API de releases: la causa del incidente del 25 de agosto desaparece de raiz, no solo
      # se esquiva fijando la version.
      - name: Instalar Supabase CLI
        if: needs.cambios.outputs.supabase == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Iniciar stack local de Supabase
        if: needs.cambios.outputs.supabase == 'true'
        # Se excluyen servicios pesados que no participan en la validacion de migraciones.
        # El esquema auth/storage sigue presente en la imagen de Postgres.
        run: supabase start -x studio,mailpit,edge-runtime,logflare,vector,supavisor,imgproxy,postgres-meta

      - name: Aplicar migraciones desde cero
        if: needs.cambios.outputs.supabase == 'true'
        run: supabase db reset

      - name: Lint de la base de datos
        if: needs.cambios.outputs.supabase == 'true'
        run: supabase db lint --local --fail-on warning

      # La red de seguridad de la base de datos (issue #221).
      #
      # Corre TODAS las suites pgTAP de supabase/tests/database contra la base recien
      # reconstruida desde cero. Comprueban el estado real: las politicas RLS rol por rol, los
      # triggers y los privilegios. Un grep sobre las migraciones no serviria -- se esquiva con
      # `TO "anon"` o con un DO block --; esto no, porque mira lo que quedo en la base.
      #
      # Hasta la #221 este paso corria un solo archivo, privilegios_anon.sql, porque habia tres
      # suites en rojo en develop. Esa es exactamente la razon por la que la regresion de la
      # issue #435 llego a mergearse: la prueba que la detectaba existia y llevaba dias en rojo
      # sin que nadie la mirara. Ahora las catorce estan en verde y el directorio entero es
      # requisito.
      #
      # Si se agrega una tabla con politicas, su suite va aqui: es lo unico que impide que una
      # politica nueva llegue a develop sin que nadie haya comprobado que hace lo que dice.
      - name: Pruebas de la base de datos
        if: needs.cambios.outputs.supabase == 'true'
        run: supabase test db

      # `supabase functions lint` ya no existe en el CLI (confirmado contra la 2.115.0, la misma
      # que fija el paso de arriba: ni `functions --help` ni `--experimental` lo listan). Este
      # paso nunca se habia ejecutado de verdad -el guardia de abajo caia siempre a la rama del
      # "else" porque no habia ninguna funcion-, asi que el comando roto quedo en verde en
      # silencio hasta la issue #523, la primera en agregar una. Se reemplaza por lo que el CLI
      # llamaba por debajo: `deno lint`/`deno check` directo sobre supabase/functions.
      - name: Instalar Deno
        if: needs.cambios.outputs.supabase == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"

      - name: Lint de Edge Functions
        if: needs.cambios.outputs.supabase == 'true'
        run: |
          deno --version
          if ls supabase/functions/*/index.* >/dev/null 2>&1; then
            deno lint --config supabase/functions/deno.json supabase/functions
            for archivo in supabase/functions/*/index.*; do
              deno check --config supabase/functions/deno.json "$archivo"
            done
          else
            echo "No hay Edge Functions todavia; se omite el lint."
          fi

  # --------------------------------------------------------------------------------
  remoto:
    name: Estado de la base remota
    needs: cambios
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Verificar secrets
        id: check
        if: needs.cambios.outputs.supabase == 'true'
        run: |
          faltan=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltan="$faltan SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && faltan="$faltan SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_REF_DEV" ] && faltan="$faltan SUPABASE_PROJECT_REF_DEV"

          if [ -n "$faltan" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se pudo consultar ecopac-dev; faltan estos secrets:$faltan"
            echo "## Estado de la base remota no verificado" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets:\`$faltan\`. Configuralos en Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      # Version fija: ver el comentario del job "Validar migraciones y funciones" (issue #422).
      - name: Instalar Supabase CLI
        if: steps.check.outputs.listo == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Vincular con ecopac-dev
        if: steps.check.outputs.listo == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF_DEV" -p "$SUPABASE_DB_PASSWORD"

      # La deriva se avisa aqui, en el PR, y no solo cuando ya revento el despliegue.
      #
      # Antes la salida del dry-run caia dentro de un bloque de codigo del resumen y se perdia:
      # el texto estaba, pero sin aviso y sin destacar, y no lo miraba nadie. Es el mismo
      # diagnostico que hace "Aplicar migraciones", movido a donde todavia sirve para algo,
      # porque mientras hay deriva **todo** push a develop falla, traiga SQL o no.
      #
      # Este job sigue sin fallar nunca, que es su diseno: depende de secrets y de la red, y
      # convertirlo en guarda haria que un corte de conexion bloquee PRs ajenos. Avisa fuerte,
      # no corta. Quien corta es "Aplicar migraciones", despues del merge.
      - name: Comparar historial local y remoto
        if: steps.check.outputs.listo == 'true'
        run: |
          salida_push="$(supabase db push --dry-run 2>&1 || true)"
          limpia="$(printf '%s' "$salida_push" | sed 's/\x1B\[[0-9;]*[a-zA-Z]//g')"

          {
            echo "## Migraciones en ecopac-dev"
            echo
            echo '```'
            supabase migration list --linked 2>&1 || true
            echo '```'
            echo
            echo "### Se aplicarian al mergear"
            echo
            echo '```'
            printf '%s\n' "$salida_push"
            echo '```'
            echo
            echo "> El dry-run confirma la conexion y lista lo pendiente, pero no ejecuta el SQL:"
            echo "> un error dentro de una migracion no aparece aqui. Quien cubre eso es la guarda"
            echo "> **Migraciones no editadas**, que evita la unica forma en que el escenario"
            echo "> incremental se aparta del que valida el CI."
          } >> "$GITHUB_STEP_SUMMARY"

          # Mismo detector que usa "Aplicar migraciones": si el CLI cambiara el texto, esto deja
          # de avisar y el despliegue vuelve a fallar solo. Se degrada al comportamiento de
          # antes, nunca a un verde falso.
          if ! printf '%s' "$limpia" | grep -q 'Remote migration versions not found'; then
            exit 0
          fi

          versiones="$(printf '%s' "$limpia" \
            | sed -n 's/.*migration repair --status reverted //p' \
            | tr -s ' ' '\n' | grep -E '^[0-9]+$' | sort -u | xargs)"

          echo "::warning::La base de ecopac-dev tiene migraciones que develop no ($versiones). Hoy TODO push a develop falla, traiga SQL o no."

          {
            echo
            echo "## Aviso: la base de ecopac-dev y develop no coinciden"
            echo
            echo "Estas versiones estan aplicadas en \`ecopac-dev\` pero no tienen archivo en la"
            echo "rama base:"
            echo
            for v in $versiones; do echo "- \`$v\`"; done
            echo
            echo "**Esto no lo causa este PR y mergearlo no lo empeora**, pero conviene saberlo:"
            echo "mientras dure, \`supabase db push\` falla en **todo** push a \`develop\`, traiga"
            echo "migraciones o no, porque valida el historial completo antes de mirar si hay algo"
            echo "pendiente. El fallo le aparece a quien mergee despues, sin que tenga que ver."
            echo
            echo "Se arregla mergeando el PR que trae esos archivos. El detalle esta en"
            echo "\`docs/CI-CD.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------------
  aplicar:
    name: Aplicar migraciones
    # La migracion no corre si la validacion fallo. Antes eran workflows independientes.
    needs: [validar, inmutabilidad]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      # Version fija: ver el comentario del job "Validar migraciones y funciones" (issue #422).
      # Este es el paso donde el rate limit tumbo el despliegue del 25 de agosto.
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Determinar ambiente y verificar secrets
        id: check
        run: |
          case "$GITHUB_REF_NAME" in
            develop) proyecto="$SUPABASE_PROJECT_REF_DEV";  ambiente="ecopac-dev";  nombre_secret="SUPABASE_PROJECT_REF_DEV" ;;
            main)    proyecto="$SUPABASE_PROJECT_REF_PROD"; ambiente="ecopac-prod"; nombre_secret="SUPABASE_PROJECT_REF_PROD" ;;
            *)       proyecto="";                           ambiente="desconocido"; nombre_secret="" ;;
          esac

          faltan=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltan="$faltan SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && faltan="$faltan SUPABASE_DB_PASSWORD"
          [ -z "$proyecto" ] && faltan="$faltan $nombre_secret"

          echo "ambiente=$ambiente" >> "$GITHUB_OUTPUT"

          # Cuando falta un secret el workflow avisa de forma visible pero no falla, para no
          # bloquear al equipo mientras termina de configurar los ambientes. Lo que no puede
          # pasar es que la omision se vea igual que un despliegue exitoso.
          if [ -n "$faltan" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Las migraciones NO se aplicaron en $ambiente. Faltan los secrets:$faltan"
            {
              echo "## Migraciones omitidas en $ambiente"
              echo
              echo "**No se aplico ninguna migracion.** Faltan estos secrets:"
              echo
              for s in $faltan; do echo "- \`$s\`"; done
              echo
              echo "Configuralos en Settings > Secrets and variables > Actions."
              echo "Mientras tanto, la base de \`$ambiente\` queda desactualizada respecto del repositorio."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
            echo "proyecto=$proyecto" >> "$GITHUB_OUTPUT"
          fi

      - name: Vincular proyecto
        if: steps.check.outputs.listo == 'true'
        run: supabase link --project-ref "${{ steps.check.outputs.proyecto }}" -p "$SUPABASE_DB_PASSWORD"

      # La deriva de historial explicada en cristiano, antes de que `db push` la escupa en
      # crudo (el merge de 93666b6).
      #
      # Si la base tiene aplicada una migracion cuyo archivo no esta en esta rama, `db push`
      # aborta con "Remote migration versions not found in local migrations directory" y un
      # `migration repair` sugerido. Ese mensaje no dice lo unico que importa: que el fallo
      # casi nunca es del commit que lo desencadena. `db push` valida el historial COMPLETO
      # antes de mirar si hay algo pendiente, asi que mientras dura la deriva tumba todo push
      # a develop, traiga SQL o no. Fue lo que paso el 30 de agosto: la 00088 se aplico a mano
      # contra ecopac-dev antes de que su PR (#586) se mergeara, y el merge que se comio el
      # fallo fue #588, un hook de reportes sin una sola linea de SQL.
      #
      # El detector es `db push --dry-run` en vez de comparar `migration list` a mano: no
      # aplica nada, pero hace exactamente la misma comprobacion de historial que el `db push`
      # de abajo. Asi el diagnostico y el despliegue no pueden discrepar. Si el CLI cambiara el
      # texto, este paso deja pasar y `db push` vuelve a fallar solo: se degrada a lo de antes,
      # nunca a un verde falso.
      - name: Comprobar el historial remoto
        if: steps.check.outputs.listo == 'true'
        run: |
          if salida="$(supabase db push --dry-run 2>&1)"; then
            echo "$salida"
            exit 0
          fi

          echo "$salida"
          limpia="$(printf '%s' "$salida" | sed 's/\x1B\[[0-9;]*[a-zA-Z]//g')"

          if ! printf '%s' "$limpia" | grep -q 'Remote migration versions not found'; then
            # Fallo por otra cosa: conexion, credenciales, una migracion rota. No es deriva y
            # no toca diagnosticarla aqui; se deja seguir para que `Aplicar migraciones` falle
            # con su propio mensaje, que es el que sirve en ese caso.
            echo "::warning::El dry-run fallo por algo que no es deriva de historial; sigue el despliegue."
            exit 0
          fi

          # Las versiones las nombra el propio CLI en la linea del repair que sugiere.
          versiones="$(printf '%s' "$limpia" \
            | sed -n 's/.*migration repair --status reverted //p' \
            | tr -s ' ' '\n' | grep -E '^[0-9]+$' | sort -u | xargs)"

          {
            echo "## La base de ${{ steps.check.outputs.ambiente }} y esta rama no coinciden"
            echo
            echo "**No se aplico ninguna migracion y la base no quedo a medias.**"
            echo
            echo "Estas versiones estan aplicadas en \`${{ steps.check.outputs.ambiente }}\` pero no"
            echo "tienen archivo en \`supabase/migrations/\` en este commit:"
            echo
            for v in $versiones; do echo "- \`$v\`"; done
            echo
            echo "### Por que suele pasar"
            echo
            echo "Casi siempre porque esa migracion se aplico **a mano** contra la base, desde una"
            echo "rama, antes de que su PR se mergeara. Mientras el archivo no este en la rama,"
            echo "\`supabase db push\` falla en **todo** push, traiga migraciones o no: valida el"
            echo "historial completo antes de mirar si hay algo pendiente. Por eso este fallo puede"
            echo "no tener nada que ver con el commit que lo disparo."
            echo
            echo "La otra causa posible es un despliegue mas nuevo que se adelanto a este."
            echo
            echo "### Como se sale"
            echo
            echo "1. Buscar el PR que trae esos archivos y mergearlo. Con eso se arregla solo, y es"
            echo "   lo que corresponde si la migracion es legitima y solo llego antes de tiempo."
            echo "2. Si la migracion se descarto de verdad y no va a existir nunca, entonces se"
            echo "   despega el registro de la base:"
            echo
            echo '   ```'
            echo "   supabase migration repair --status reverted $versiones"
            echo '   ```'
            echo
            echo "No se edita ninguna migracion ya aplicada para salir de esto."
            echo
            echo "> Recordatorio: las migraciones se aplican mergeando, no a mano. Ver \`docs/CI-CD.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::La base de ${{ steps.check.outputs.ambiente }} tiene migraciones que esta rama no ($versiones). No se aplico nada; ver el resumen de la corrida."
          exit 1

      - name: Aplicar migraciones
        if: steps.check.outputs.listo == 'true'
        run: supabase db push

      - name: Resumen del despliegue
        if: steps.check.outputs.listo == 'true'
        run: |
          {
            echo "## Migraciones aplicadas en ${{ steps.check.outputs.ambiente }}"
            echo
            echo '```'
            supabase migration list --linked 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------------
  avisar:
    name: Avisar fallo
    needs: [validar, inmutabilidad, aplicar]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # actions: read permite leer el resultado de cada paso de esta misma corrida, que es lo
      # que deja decir si las migraciones se aplicaron o no en vez de suponerlo (issue #422).
      actions: read
    steps:
      # El fallo de un despliegue paso desapercibido cuatro corridas seguidas. Una issue
      # abierta es mas dificil de ignorar que un check rojo en la lista de commits.
      - name: Abrir issue si no hay una ya
        uses: actions/github-script@v8
        with:
          script: |
            const rama = context.ref.replace('refs/heads/', '');
            const titulo = `[BUG] Fallo el despliegue de base de datos en ${rama}`;
            const corrida = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const abiertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'type:bug,module:infra',
            });

            const yaExiste = abiertas.data.some((i) => i.title === titulo);
            if (yaExiste) {
              core.notice(`Ya hay una issue abierta para el fallo en ${rama}; no se duplica.`);
              return;
            }

            // Que paso exactamente, leido de la propia corrida en vez de darlo por hecho.
            //
            // El texto anterior afirmaba siempre "la base quedo desactualizada" y mandaba a
            // "ver en que migracion se detuvo". El 25 de agosto las dos cosas eran falsas: el
            // job murio instalando el CLI y el `db push` ni siquiera llego a ejecutarse, asi
            // que quien leyera la issue iba a buscar una migracion rota que no existia.
            let pasosFallidos = [];
            let estadoDelPush = 'desconocido';

            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });

              for (const job of data.jobs) {
                for (const paso of job.steps ?? []) {
                  if (paso.conclusion === 'failure') {
                    pasosFallidos.push(`${job.name} -> ${paso.name}`);
                  }
                  // El paso que de verdad escribe en la base remota. Su nombre coincide con el
                  // del job, por eso se compara tambien el job.
                  if (job.name === 'Aplicar migraciones' && paso.name === 'Aplicar migraciones') {
                    estadoDelPush = paso.conclusion ?? 'desconocido';
                  }
                }
              }
            } catch (error) {
              core.warning(`No se pudieron leer los pasos de la corrida: ${error.message}`);
            }

            // La deriva de historial se diagnostica aparte y va primero. Deja `Aplicar
            // migraciones` en `skipped`, y el texto de ese caso manda a relanzar la corrida:
            // para la deriva eso es falso, relanzar vuelve a fallar igual porque el problema
            // esta en la base, no en la corrida.
            const hayDeriva = pasosFallidos.some((p) => p.endsWith('Comprobar el historial remoto'));

            // Cuatro desenlaces distintos, y cada uno se arregla de otra forma.
            const diagnostico = hayDeriva
              ? [
                  `**No se aplico ninguna migracion, y la base de \`${rama}\` no quedo a medias.**`,
                  '',
                  'La base tiene aplicadas migraciones cuyo archivo no esta en esta rama, asi que',
                  '`supabase db push` se nego a tocarla. El resumen de la corrida dice cuales son.',
                  '',
                  'Casi siempre es una migracion aplicada **a mano** contra la base antes de que su',
                  'PR se mergeara. Mientras eso dure, falla **todo** push a la rama, traiga',
                  'migraciones o no: por eso este fallo puede no tener nada que ver con el commit',
                  'que lo disparo. Relanzar la corrida no lo arregla.',
                  '',
                  '- [ ] Abrir el resumen de la corrida y ver que versiones sobran en la base',
                  '- [ ] Buscar el PR que trae esos archivos y mergearlo (con eso se arregla solo)',
                  '- [ ] Si esa migracion se descarto de verdad, `supabase migration repair --status reverted <version>`',
                  '- [ ] Confirmar con `supabase migration list --linked` que la base quedo al dia',
                ]
              : estadoDelPush === 'failure'
                ? [
                    `**La base de \`${rama}\` puede haber quedado a medias.** El paso \`Aplicar migraciones\``,
                    'empezo a correr y fallo, asi que se detuvo dentro de una migracion.',
                    '',
                    '- [ ] Abrir el log de la corrida y ver en que migracion se detuvo',
                    '- [ ] Confirmar si alguna migracion ya aplicada fue editada (esa es la causa mas comun)',
                    '- [ ] Corregir hacia adelante con una migracion nueva, sin editar las existentes',
                    '- [ ] Confirmar con `supabase migration list --linked` que la base quedo al dia',
                  ]
                : estadoDelPush === 'skipped'
                  ? [
                      `**No se aplico ninguna migracion, y la base de \`${rama}\` no quedo a medias.**`,
                      'El paso `Aplicar migraciones` no llego a ejecutarse: algo fallo antes.',
                      '',
                      'No hay que buscar una migracion rota. Lo que corresponde es mirar el paso que si',
                      'fallo y volver a lanzar la corrida; el proximo push aplica lo pendiente igual,',
                      'porque `supabase db push` sube todo lo que falte.',
                      '',
                      '- [ ] Ver el paso que fallo, listado arriba',
                      '- [ ] Relanzar la corrida (Re-run failed jobs) y confirmar que queda en verde',
                      '- [ ] Confirmar con `supabase migration list --linked` que la base esta al dia',
                    ]
                  : [
                      'No se pudo determinar si las migraciones se aplicaron.',
                      '',
                      '- [ ] Abrir el log de la corrida y revisar el job `Aplicar migraciones`',
                      '- [ ] Confirmar con `supabase migration list --linked` que la base quedo al dia',
                    ];

            const detalleDeFallos =
              pasosFallidos.length > 0
                ? ['### Pasos que fallaron', '', ...pasosFallidos.map((p) => `- \`${p}\``), '']
                : [];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              labels: ['type:bug', 'module:infra', 'priority:alta', 'platform:shared'],
              body: [
                '### Que paso',
                '',
                `El workflow de Supabase fallo tras un push a \`${rama}\`.`,
                '',
                `Corrida: ${corrida}`,
                `Commit: ${context.sha}`,
                '',
                ...detalleDeFallos,
                '### Estado de la base',
                '',
                ...diagnostico,
                '',
                'Ver `docs/CI-CD.md`.',
                '',
                '_Issue abierta automaticamente por el workflow de Supabase._',
              ].join('\n'),
            });

  # --------------------------------------------------------------------------------
  completo:
    name: Supabase completo
    needs: [cambios, inmutabilidad, validar, remoto, aplicar]
    # `always()` es imprescindible: sin el, este job se saltaria en cuanto uno de los `needs`
    # fallara, y un check que se salta cuenta como aprobado para la proteccion de rama. Seria
    # justo lo contrario de lo que se busca.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # POR QUE EXISTE ESTE JOB
      #
      # 1. Para la proteccion de rama, un check requerido que termina en `skipped` cuenta como
      #    aprobado. `remoto` se salta en los push (solo corre en pull_request) y `validar`
      #    puede saltarse cuando no hay cambios en supabase/. Marcarlos como requeridos uno por
      #    uno da una sensacion de cobertura que no es real. Aqui se mira el resultado de cada
      #    job y se decide a mano.
      #
      # 2. Reduce la lista de checks requeridos a un nombre por workflow. Cinco nombres hay que
      #    mantenerlos sincronizados con el YAML cada vez que se renombra o se agrega un job;
      #    uno solo, no. Renombrar un job de aqui adentro ya no rompe la configuracion.
      #
      # `skipped` se acepta a proposito: es el resultado legitimo de un job que no aplicaba a
      # este evento. Lo que no se acepta es `failure` ni `cancelled`.
      #
      # POR QUE `aplicar` ESTA EN LA LISTA, aunque solo corra en push
      #
      # Porque no estaba, y por eso un despliegue fallido se reportaba como exito. El 30 de
      # agosto los merges de #606 y #607 tumbaron "Aplicar migraciones" -deriva de historial,
      # ninguno traia SQL- y este job dijo `success` en las dos corridas. Quien miraba el commit
      # no veia nada raro, y el resumen que explica el fallo, que esta bien escrito, no lo leyo
      # nadie: hay que saber que existe un job aparte para ir a abrirlo.
      #
      # En un pull_request `aplicar` sale `skipped` y el bucle ya lo cuenta como OK, asi que
      # incluirlo no cambia nada ahi. Lo unico que cambia es que un despliegue roto deja de
      # pasar por bueno. No sacarlo de aqui por parecer que "solo corre en push": es
      # precisamente en push donde este agregado es lo unico que se mira.
      - name: Revisar el resultado de cada job
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          INMUTABILIDAD: ${{ needs.inmutabilidad.result }}
          VALIDAR: ${{ needs.validar.result }}
          REMOTO: ${{ needs.remoto.result }}
          APLICAR: ${{ needs.aplicar.result }}
        run: |
          fallidos=""
          for job in "Detectar cambios:$CAMBIOS" \
                     "Migraciones no editadas:$INMUTABILIDAD" \
                     "Validar migraciones y funciones:$VALIDAR" \
                     "Estado de la base remota:$REMOTO" \
                     "Aplicar migraciones:$APLICAR"; do
            nombre="${job%:*}"
            resultado="${job##*:}"
            case "$resultado" in
              success | skipped) echo "OK       $nombre ($resultado)" ;;
              *)
                echo "FALLO    $nombre ($resultado)"
                fallidos="$fallidos\n- $nombre: \`$resultado\`"
                ;;
            esac
          done

          if [ -n "$fallidos" ]; then
            {
              echo "## Supabase completo: fallo"
              echo
              echo "Estos jobs no terminaron bien:"
              printf "%b\n" "$fallidos"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## Supabase completo: todo en orden" >> "$GITHUB_STEP_SUMMARY"
