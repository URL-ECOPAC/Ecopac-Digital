name: CI

# Corre en cada Pull Request hacia develop o main, y en cada push a esas ramas.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    name: Lint y build
    runs-on: ubuntu-latest
    # Diez minutos es el presupuesto que fija la issue #223. Las corridas reales van en ~40 s
    # -de los cuales las pruebas son ~10 s-, asi que el tope no aprieta: esta para que un
    # cambio que dispare el tiempo se note aqui y no en la paciencia de quien espera el PR.
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # Bloquea solo lo critico: medido el 2026-09-17 hay 15 vulnerabilidades conocidas (14
      # moderate, 1 high) en la cadena de @expo/config-plugins (tooling de mobile, no codigo
      # publicado), sin arreglo disponible sin un downgrade que rompe Expo. Bloquear en "high"
      # dejaria el PR en rojo por algo que no se puede resolver hoy; "critical" si es nuevo de
      # verdad. dependabot.yml mantiene las dependencias al dia por separado (issue #760).
      - name: Auditoria de dependencias (bloqueante en critical)
        run: npm audit --audit-level=critical

      - name: Auditoria de dependencias (aviso en high, no bloquea)
        if: always()
        run: |
          if npm audit --audit-level=high > /tmp/npm-audit.txt 2>&1; then
            echo "Sin vulnerabilidades high o superiores."
            exit 0
          fi

          echo "::warning::npm audit encontro vulnerabilidades high o superiores. Revisar el resumen."
          {
            echo "## Vulnerabilidades de dependencias (high o superior)"
            echo
            echo '```'
            cat /tmp/npm-audit.txt
            echo '```'
            echo
            echo "Detalle de por que no bloquea el PR en docs/SEGURIDAD.md."
          } >> "$GITHUB_STEP_SUMMARY"

      # Va primero de las comprobaciones porque es la mas barata: no usa la base de datos ni
      # credenciales, solo compara texto entre packages/shared y supabase/migrations/, y tarda
      # un segundo. Corre en el mismo job que el lint para que el check requerido siga
      # llamandose "Lint y build" y no haya que tocar la proteccion de ramas (issue #492).
      #
      # Siete issues describen el mismo defecto -shared consultando columnas que no existen,
      # mergeado en verde-. Las pruebas no lo detectan porque el doble del cliente de Supabase
      # se escribe leyendo el codigo que se va a probar, no la migracion.
      - name: Verificar packages/shared contra el esquema
        if: >-
          github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'esquema-verificado-a-mano')
        run: npm run verificar:shared-esquema

      - name: Aviso de guarda de esquema desactivada
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'esquema-verificado-a-mano')
        run: |
          echo "::warning::La guarda de esquema se salto por la etiqueta esquema-verificado-a-mano."
          {
            echo "## Guarda de esquema desactivada"
            echo
            echo "Este PR lleva la etiqueta \`esquema-verificado-a-mano\`, asi que no se comparo"
            echo "\`packages/shared\` con \`supabase/migrations/\`. La descripcion del PR tiene que"
            echo "decir por que, y quien revise tiene que comprobar los nombres a mano."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar el analizador de esquema contra sus propios casos
        run: npm run verificar:shared-esquema -- --autoprueba

      # Guarda del rewrite de SPA (issue #59). Vercel solo lee el vercel.json que este dentro
      # del Root Directory del proyecto, y ese ajuste vive en el Dashboard: desde el
      # repositorio no se puede saber cual de los dos se va a usar. Por eso hay uno en la raiz
      # y otro en apps/web, y esto comprueba que no diverjan. Si divergen, el rewrite deja de
      # aplicarse sin ningun error de build y las rutas empiezan a dar 404 al recargar.
      - name: Comprobar el rewrite de SPA de Vercel
        run: npm run verificar:rewrite-vercel

      # Cabeceras de seguridad HTTP (issue #760): vercel.json (raiz), apps/web/vercel.json y
      # apps/web/nginx.conf tienen que declarar las mismas seis cabeceras. Sin esto, alguien
      # corrige un lugar y el otro queda desactualizado sin ningun error de build.
      - name: Comprobar las cabeceras de seguridad HTTP
        run: npm run verificar:cabeceras-http

      - name: Comprobar el verificador de cabeceras contra sus propios casos
        run: npm run verificar:cabeceras-http -- --autoprueba

      # AGENTS.md prohibe los emojis en el codigo y nada lo verificaba: al escribir la guarda
      # habia 79 lineas con pictogramas en 30 archivos (issue #700). La mitad eran comentarios;
      # la otra mitad, interfaz -y ahi el emoji llegaba a ser el unico portador del nivel de una
      # alerta, que un lector de pantalla no lee-.
      #
      # No prohibe la tipografia monocroma (flechas, la equis de cerrar): la cabecera del script
      # explica por que y que costaria cambiarlo.
      - name: Comprobar que no haya emojis en el codigo
        run: npm run verificar:sin-emojis

      - name: Comprobar el detector de emojis contra sus propios casos
        run: npm run verificar:sin-emojis -- --autoprueba

      # Red de la migracion de colores (issue #700): compara el color EFECTIVO de cada archivo
      # -los hexadecimales a mano mas el valor de los tokens que menciona- contra una linea base.
      # Cambiar "#2A9C36" por colors.primary no la mueve; cambiarlo por colors.info si, y ahi
      # falla. Es lo unico que detecta una regresion visual en dos apps que no tienen ninguna
      # prueba de ese tipo.
      - name: Comprobar que ningun color efectivo cambio
        run: npm run verificar:paleta

      - name: Comprobar el comparador de paleta contra sus propios casos
        run: npm run verificar:paleta -- --autoprueba

      # La primera guarda que mira apps/ (issue #821). Las otras cuatro miran packages/shared, y
      # por eso la ficha del paciente en movil pudo estar rota de punta a punta con el lint, las
      # 2.145 pruebas y verificar:shared-esquema en verde (issue #818): la pantalla leia
      # `respuesta.datos` de una funcion que devuelve `{ triajes, error }`, y equivocarse de clave
      # no lanza nada, devuelve una lista vacia.
      #
      # Comprueba el sobre que devuelve cada funcion de *.api.js, la forma de cada elemento
      # -siguiendola por el hook que la guarda en estado hasta el componente- y los descriptores
      # de columnas. Lo que no puede resolver lo cuenta y lo informa; la cabecera del script dice
      # que queda fuera y por que.
      - name: Comprobar los contratos de API que consume apps/
        run: npm run verificar:contratos

      - name: Comprobar el verificador de contratos contra sus propios casos
        run: npm run verificar:contratos -- --autoprueba

      - name: Ejecutar lint en todos los workspaces
        run: npm run lint

      # Prettier estaba configurado (.prettierrc) y en devDependencies desde antes, pero sin
      # script format/format:check ni paso de CI que lo llamara: la configuracion era
      # decorativa y el repositorio mezclaba estilos hasta dentro del mismo archivo (issue
      # #515). Alcance JS/JSX/TS/TSX/JSON unicamente (ver .prettierignore): supabase/ (SQL) y
      # docs/ (Markdown con tablas armadas a mano) y .github/ (YAML con comentarios alineados a
      # proposito) quedan fuera a proposito, no por descuido.
      - name: Comprobar formato con Prettier
        run: npm run format:check

      # Antes del build a proposito: una prueba rota se ve en segundos, sin esperar a que
      # la web compile. Corre en el mismo job que el lint para que el check requerido siga
      # llamandose "Lint y build" y no haya que tocar la proteccion de ramas.
      #
      # El paso corre `npm test` a secas, sin capturar la salida: vitest detecta Actions y agrega
      # su reporter `github-actions`, que ya publica el conteo de pruebas en el resumen de la
      # corrida. No se ve al correr las pruebas en local, y por eso es facil no saber que existe.
      - name: Ejecutar las pruebas de todos los workspaces
        run: npm test

      # npm test corre "npm run test --workspaces --if-present": un workspace sin script test
      # se salta en silencio, sin que nada en la salida del paso anterior lo distinga de un
      # workspace que si corrio (issue #515, docs/CI-CD.md tiene el detalle de por que
      # apps/mobile sigue sin uno). Este paso no cambia ese comportamiento -sigue siendo
      # deliberado para apps/mobile-, solo lo hace visible en vez de que haya que saberlo de
      # memoria para notarlo.
      - name: Avisar que workspaces no tienen script test
        if: always()
        run: |
          sin_test=""
          for pkg in apps/web apps/mobile packages/shared packages/ui-tokens; do
            if ! grep -q '"test"' "$pkg/package.json"; then
              sin_test="$sin_test $pkg"
            fi
          done

          if [ -n "$sin_test" ]; then
            echo "::warning::Workspaces sin script test (npm test los omite en silencio):$sin_test"
            {
              echo "## Workspaces sin script \`test\`"
              echo
              echo "npm test los omite en silencio (\`--workspaces --if-present\`). Detalle en docs/CI-CD.md."
              echo
              for pkg in $sin_test; do
                echo "- \`$pkg\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Lo que vitest no publica es la cobertura, que desde la #219 es una guarda con umbral y no
      # una estadistica. `if: always()` porque el resumen de una corrida en rojo es el que mas
      # falta hace; el script nunca falla, es un reporte y no una guarda, y quien decide si el CI
      # pasa es el paso de arriba.
      - name: Publicar la cobertura en el resumen
        if: always()
        run: node scripts/resumen-de-pruebas.mjs >> "$GITHUB_STEP_SUMMARY"

      # Cada rama se construye con la configuración de su ambiente. Antes se usaban
      # siempre los secrets _DEV, así que main nunca se validaba contra producción y un
      # secret de producción mal configurado no aparecía hasta el despliegue.
      - name: Elegir el ambiente del build
        id: ambiente
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
            echo "nombre=produccion" >> "$GITHUB_OUTPUT"
          else
            echo "nombre=desarrollo" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir la aplicación web (desarrollo)
        if: steps.ambiente.outputs.nombre == 'desarrollo'
        run: npm run build --workspace=apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}

      - name: Construir la aplicación web (producción)
        if: steps.ambiente.outputs.nombre == 'produccion'
        run: npm run build --workspace=apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}

      - name: Avisar si faltan los secrets de producción
        if: steps.ambiente.outputs.nombre == 'produccion'
        env:
          VITE_SUPABASE_URL_PROD: ${{ secrets.VITE_SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY_PROD: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
        run: |
          if [ -n "$VITE_SUPABASE_URL_PROD" ] && [ -n "$VITE_SUPABASE_ANON_KEY_PROD" ]; then
            echo "Los secrets de producción están configurados."
            exit 0
          fi

          echo "::warning::La web se construyó sin VITE_SUPABASE_URL_PROD ni VITE_SUPABASE_ANON_KEY_PROD."
          {
            echo "## Build de producción sin configuración"
            echo
            echo "Faltan \`VITE_SUPABASE_URL_PROD\` y/o \`VITE_SUPABASE_ANON_KEY_PROD\`."
            echo "El bundle se generó apuntando a ningún lado. Configúralos en"
            echo "Settings > Secrets and variables > Actions antes de desplegar."
          } >> "$GITHUB_STEP_SUMMARY"

      # La app móvil no se "compila" en cada PR (eso lo hace Expo/EAS por separado),
      # pero el lint de arriba ya la cubre porque apps/mobile tiene su propio script.
