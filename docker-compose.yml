# Entorno de desarrollo local con Docker.
# Levanta la aplicacion web con hot reload. No reemplaza a Supabase en la nube.
#
# Uso:
#   docker compose up --build                  -> web en http://localhost:5173
#
# Para el esquema completo (RLS, roles anon/authenticated/service_role, esquema auth,
# extensiones) usa el CLI oficial de Supabase, no un Postgres pelado: supabase start
# (docs/QUICKSTART.md). Este archivo tenia antes un perfil db-local que montaba
# supabase/migrations sobre postgres:16-alpine liso; la primera migracion ya asume auth.uid(),
# el esquema extensions y esos tres roles, ninguno de los cuales existe en esa imagen, asi que
# el perfil nunca llegaba a aplicar ni una migracion (issue #515). Se retira en vez de
# arreglarse: arreglarlo bien es reconstruir adentro lo que supabase start ya hace, mejor y
# mantenido por Supabase, no por este repositorio.
#
# Para produccion usa docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# El project name es distinto al de produccion (ecopac-prod) para que ambos
# entornos puedan correr al mismo tiempo sin reemplazar sus contenedores.

name: ecopac-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: ecopac-web
    ports:
      - "5173:5173"
    volumes:
      # Se monta SOLO el codigo fuente del host (hot reload). El node_modules
      # queda exclusivamente dentro de la imagen: asi el node_modules del host
      # (Windows/macOS) no tapa el de Linux ni quedan volumenes desactualizados
      # al cambiar dependencias (basta con rebuildar la imagen).
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.js:/app/apps/web/vite.config.js
      - ./packages:/app/packages
    env_file:
      - path: .env.development
        required: false
